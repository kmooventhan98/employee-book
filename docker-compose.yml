services:
  # Production / Default App Service
  # Uses Thruster (HTTP/2, compression, asset caching) and Puma with Solid Queue.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: employee-book:latest
    container_name: employee-book-app
    ports:
      - "${PORT:-3000}:80"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_FORCE_SSL=false
      - RAILS_ASSUME_SSL=false
      - SOLID_QUEUE_IN_PUMA=true
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY:-}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
    volumes:
      - storage_data:/rails/storage
    restart: unless-stopped

  # Optional Development Service (for live code editing & hot reloading)
  # Run with: docker-compose --profile dev up dev
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: employee-book:dev
    container_name: employee-book-dev
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development
      - RAILS_LOG_TO_STDOUT=true
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - storage_data:/rails/storage
    profiles:
      - dev

volumes:
  storage_data:
  bundle_cache:
